name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build HSP-Onboarding
        run: npm run build:client -w hsp-onboarding

      - run: cp HSP-Onboarding/dist/spa/index.html HSP-Onboarding/dist/spa/404.html
      - run: touch HSP-Onboarding/dist/spa/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: HSP-Onboarding/dist/spa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
