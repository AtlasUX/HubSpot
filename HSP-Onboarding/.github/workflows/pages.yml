name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build HSP-Onboarding
        run: npm run build:client -w hsp-onboarding

      - run: cp HSP-Onboarding/dist/spa/index.html HSP-Onboarding/dist/spa/404.html
      - run: touch HSP-Onboarding/dist/spa/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: HSP-Onboarding/dist/spa
          branch: gh-pages
